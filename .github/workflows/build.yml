name: CI Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Tests
        uses: ballerina-platform/ballerina-action@master
        with:
          args: test

      - name: Build Package
        uses: ballerina-platform/ballerina-action@master
        with:
          args: pack
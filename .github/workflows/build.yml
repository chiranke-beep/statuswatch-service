name: CI Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ballerina
        uses: ballerina-platform/ballerina-action@master
        with:
          version: 2201.14.0

      - name: Run Tests
        run: bal test

      - name: Build Package
        run: bal pack